- defaults:
        relink: true
        create: true

- clean: ['~']

- link:
        ~/.gitconfig:
                force: true
                path: git/gitconfig
        ~/.tmux.conf:
                force: true
                path: tmux/tmux.conf
        ~/.tmux.conf.local:
                force: true
                path: tmux/tmux.conf.local
        ~/.vim:
                force: true
                path: vim
        ~/.vimrc:
                relink: true
                path: vim/vimrc
        ~/.oh-my-zsh/custom/themes/hydai.zsh-theme:
                force: true
                path: oh-my-zsh/custom/themes/hydai.zsh-theme
        ~/.zshrc:
                force: true
                path: oh-my-zsh/zshrc

- shell:
        -
                command: test -d "$HOME/.oh-my-zsh" || KEEP_ZSHRC=yes sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
                stdout: true
                stderr: true
                description: Install oh-my-zsh
        -
                command: ./scripts/install-vim-tools.sh
                stdout: true
                stderr: true
                description: Install Vim command-line dependencies
        -
                command: vim -Nu NONE -n -es -i NONE +"silent mkspell! vim/spell/en.utf-8.add" +qall
                stderr: true
                description: Compile Vim spell additions
        -
                command: vim -Nu "$HOME/.vimrc" -n -es -i NONE +PlugInstall +qall
                stdout: true
                stderr: true
                description: Install Vim plugins
        -
                command: test -d "${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins/zsh-syntax-highlighting" || git clone https://github.com/zsh-users/zsh-syntax-highlighting.git "${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins/zsh-syntax-highlighting"
                stdout: true
                description: Install zsh-syntax-highlighting
        -
                command: test -d "${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins/zsh-autosuggestions" || git clone https://github.com/zsh-users/zsh-autosuggestions "${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}/plugins/zsh-autosuggestions"
                stdout: true
                description: Install zsh-autosuggestions
